const fsNativeEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const canNativeFs=()=>!!(view.requestFullscreen||view.webkitRequestFullscreen||view.webkitRequestFullScreen);
const isFs=()=>fsNativeEl()===view||view.classList.contains('pseudo-fs');
const fsMode=()=>view.classList.contains('pseudo-fs')?'pseudo':(fsNativeEl()===view?'native':false);
window.syncFsUi=function syncFsUi(){const on=isFs(),btn=$('fsBtn');
 btn.classList.toggle('is-fs',on);btn.setAttribute('aria-pressed',on?'true':'false');
 btn.setAttribute('aria-label',on?T.fsx:T.fs);btn.title=on?T.fsx:T.fs;
 requestAnimationFrame(()=>{resize();setTimeout(resize,150)})}
function enterPseudo(){if(view.classList.contains('pseudo-fs'))return;view.classList.add('pseudo-fs');document.documentElement.classList.add('fs-pseudo');syncFsUi()}
function exitPseudo(){if(!view.classList.contains('pseudo-fs'))return;view.classList.remove('pseudo-fs');document.documentElement.classList.remove('fs-pseudo');syncFsUi()}
function enterNative(){const fn=view.requestFullscreen||view.webkitRequestFullscreen||view.webkitRequestFullScreen;if(!fn)return Promise.reject(new Error('no fs'));try{const r=fn.call(view,typeof Element!=='undefined'?Element.ALLOW_KEYBOARD_INPUT:undefined);return r&&typeof r.then==='function'?r:Promise.resolve()}catch(err){return Promise.reject(err)}}
function exitNative(){const fn=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen;if(!fn)return Promise.resolve();try{const r=fn.call(document);return r&&typeof r.then==='function'?r:Promise.resolve()}catch(_){return Promise.resolve()}}
function enterFs(mode){if(isFs())return Promise.resolve(fsMode());
 if(mode==='pseudo'||!canNativeFs()){enterPseudo();return Promise.resolve('pseudo')}
 return enterNative().then(()=>{if(fsNativeEl()===view){syncFsUi();return 'native'}enterPseudo();return 'pseudo'}).catch(()=>{enterPseudo();return 'pseudo'})}

let last=performance.now();
function armClock(){last=performance.now()}
function startLoop(){renderer.setAnimationLoop(tick)}
function tick(now){
 const t=(typeof now==='number'&&isFinite(now))?now:performance.now();
 let dt=(t-last)/1000;
 if(!isFinite(dt)||dt<0)dt=0;else if(dt>0.1)dt=0.1;
 last=t;
 if(playing){const inc=2*Math.PI*daysPerSec*dt/YEAR;if(isFinite(inc)){Mvis+=inc;update()}}
 sun.rotation.x=Math.PI/2;sun.rotation.y=Mvis*YEAR/27;
 const w=earthW();
 if(tween){tween.k=Math.min(1,tween.k+dt/1.2);const s=tween.k*tween.k*(3-2*tween.k);
  const p1=tween.rel?w.clone().add(tween.off):tween.p1,t1=tween.rel?w:tween.t1;
  camera.position.lerpVectors(tween.p0,p1,s);controls.target.lerpVectors(tween.t0,t1,s);if(tween.k>=1)tween=null}
 else if(follow){const dl=w.clone().sub(lastEarth);camera.position.add(dl);controls.target.add(dl)}
 lastEarth.copy(w);controls.update();
 if(atmMat){const toSun=sun.getWorldPosition(new THREE.Vector3()).sub(earth.getWorldPosition(new THREE.Vector3())).normalize();atmMat.uniforms.lightDir.value.copy(toSun).transformDirection(camera.matrixWorldInverse)}
 renderer.render(scene,camera)}
